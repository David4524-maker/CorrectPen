<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 240px; padding: 12px; font-family: system-ui, sans-serif; }
    h3 { margin: 0 0 12px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; }
    select, button { width: 100%; margin-bottom: 10px; padding: 6px; box-sizing: border-box; }
    button { cursor: pointer; }
    .status { font-size: 12px; color: #555; margin-top: 4px; text-align: center; }
  </style>
</head>
<body>
  <h3 data-i18n="extName">CorrectPen</h3>
  <label for="lang" data-i18n="languageLabel">Idioma</label>
  <select id="lang">
    <option value="es">Español</option>
    <option value="en">English</option>
    <option value="pt">Português</option>
  </select>
  <button id="toggle">…</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
